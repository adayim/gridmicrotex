url: https://adayim.github.io/gridmicrotex/
template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: "Getting started"
      - text: Introduction to gridmicrotex
        href: articles/getting-started.html
      - text: "ggplot2"
      - text: Using LaTeX Math in ggplot2
        href: articles/ggplot2-integration.html

reference:
  - title: Core rendering
    desc: Create and draw LaTeX math as grid grobs
    contents:
      - latex_grob
      - grid.latex
      - latex_dims
      - latex_tree
      - grobMark

  - title: Options, macros, and cache
    desc: Project-wide defaults and advanced tooling
    contents:
      - latex_options
      - reset_latex_options
      - define_macro
      - clear_macros
      - list_macros
      - latex_cache_info
      - latex_cache_limit
      - latex_cache_clear

  - title: ggplot2 integration
    desc: Use LaTeX in ggplot2 plots
    contents:
      - geom_latex
      - element_latex

  - title: Font management
    desc: Load and configure math and text fonts
    contents:
      - available_math_fonts
      - load_font
      - check_fonts
  - title: Misc utilities
    desc: Utilities for working with LaTeX strings and rendering
    contents:
      - latex_wrap

articles:
  - title: Getting started
    contents:
      - getting-started
  - title: ggplot2
    contents:
      - ggplot2-integration
