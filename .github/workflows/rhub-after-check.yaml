# Runs the R-hub container checks -- sanitizers, valgrind, rchk,
# no-long-double -- which an ordinary CI matrix cannot provide.
#
# Each container is a full check taking tens of minutes, so this is
# deliberately not wired to pushes or to ordinary releases. It runs when you
# ask for it:
#
#   * "Run workflow" in the Actions tab (workflow_dispatch), which is the
#     usual way to check a candidate before a CRAN submission; or
#   * publishing a GitHub *pre-release*, e.g. a v0.1.1-rc tag.
#
# A normal (non-pre-release) publish does not trigger it.
#
# rhub.yaml is R-hub's canonical workflow and is regenerated by
# rhub::rhub_setup(), so it is left untouched; this file only dispatches it.
name: rhub-on-demand

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      config:
        description: 'Comma-separated R-hub platforms'
        type: string
        default: 'clang-asan,gcc-asan,valgrind,rchk,nold'
      ref:
        description: 'Git ref to check (branch or tag). Defaults to main.'
        type: string
        default: 'main'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the R-hub workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG: ${{ github.event.inputs.config || 'clang-asan,gcc-asan,valgrind,rchk,nold' }}
          # For a pre-release, check exactly the commit that was tagged.
          REF: ${{ github.event.release.tag_name || github.event.inputs.ref || 'main' }}
        run: |
          gh workflow run rhub.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REF" \
            -f config="$CONFIG" \
            -f name="on-demand $REF"
